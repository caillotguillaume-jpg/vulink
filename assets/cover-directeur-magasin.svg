<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf9f7"/>
      <stop offset="55%" stop-color="#f0eeeb"/>
      <stop offset="100%" stop-color="#e8e4de"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- lignes ascendantes évoquant une progression de carrière -->
  <g stroke="#0e0e0e" stroke-width="1.4" fill="none" opacity="0.9">
    <polyline points="90,340 220,340 220,275 350,275 350,210 480,210 480,150 610,150"/>
  </g>
  <g fill="#b8975a">
    <circle cx="610" cy="150" r="6"/>
  </g>
  <g fill="#0e0e0e">
    <circle cx="90" cy="340" r="4"/>
    <circle cx="220" cy="275" r="4"/>
    <circle cx="350" cy="210" r="4"/>
    <circle cx="480" cy="150" r="4"/>
  </g>

  <!-- motif oeil, repris du logo, en filigrane -->
  <g transform="translate(500,255) scale(1.55)" opacity="0.9">
    <path d="M -60 5 C -40 -28 -14 -42 12 -42 C 46 -42 74 -20 88 6 C 74 32 46 54 12 54 C -14 54 -40 40 -60 5 Z"
          fill="none" stroke="#0e0e0e" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M -34 -6 L 4 46 L 34 -18 C 38 -27 30 -34 22 -28 L 4 5"
          fill="none" stroke="#0e0e0e" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- deco fine -->
  <line x1="90" y1="380" x2="610" y2="380" stroke="#0e0e0e" stroke-opacity="0.12" stroke-width="1"/>
</svg>
