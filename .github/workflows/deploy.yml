name: Déploiement automatique vers OVH

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Envoi des fichiers sur OVH
    runs-on: ubuntu-latest
    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Synchroniser avec le serveur FTP OVH
      uses: SamKirsch/ftp-deploy@v3
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./
